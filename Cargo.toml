[package]
name = "viti"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
directories = "6"
futures-util = "0.3"
gtk4 = { version = "0.11", features = ["v4_18"] }
libc = "0.2"
mongodb = { version = "3", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls", "dns-resolver", "zstd-compression", "snappy-compression", "zlib-compression"] }
bson = { version = "3", features = ["serde", "serde_json-1", "chrono-0_4"] }
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shell-words = "1"
sourceview5 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
vte4 = { version = "0.10", features = ["v0_78"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
